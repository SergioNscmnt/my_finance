services:
  db:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_NAME_TEST: ${DATABASE_NAME_TEST}
      MASSIVE_API_BASE_URL: ${MASSIVE_API_BASE_URL}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY}
      MASSIVE_API_TIMEOUT: ${MASSIVE_API_TIMEOUT}
      MASSIVE_API_CRYPTO_QUOTE_CURRENCY: ${MASSIVE_API_CRYPTO_QUOTE_CURRENCY}
      MASSIVE_API_CACHE_MINUTES: ${MASSIVE_API_CACHE_MINUTES}
      MASSIVE_AUTO_SYNC_DIVIDENDS: ${MASSIVE_AUTO_SYNC_DIVIDENDS}
      MASSIVE_INSTRUMENT_SYNC_MAX_PAGES: ${MASSIVE_INSTRUMENT_SYNC_MAX_PAGES}
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      - db
    platform: linux/amd64

volumes:
  db_data:
