services:
  db:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_NAME_TEST: ${DATABASE_NAME_TEST}
      FRANKFURTER_API_BASE_URL: ${FRANKFURTER_API_BASE_URL}
      FRANKFURTER_API_TIMEOUT: ${FRANKFURTER_API_TIMEOUT}
      FRANKFURTER_QUOTE_CURRENCY: ${FRANKFURTER_QUOTE_CURRENCY}
      FRANKFURTER_CACHE_MINUTES: ${FRANKFURTER_CACHE_MINUTES}
      FRANKFURTER_LIVE_CACHE_SECONDS: ${FRANKFURTER_LIVE_CACHE_SECONDS}
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    platform: linux/amd64

volumes:
  db_data:
